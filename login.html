<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secur1y - Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            /* Discord SVG Background */
            background-image: url('https://github.com/secur1y/secur1y.github.io/blob/main/assets/lbg.png?raw=true');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .login-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .title-image {
            width: 100%;
            max-width: 320px;
            margin-bottom: 2rem;
            filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.3));
        }

        /* Mount point for Clerk */
        #clerk-auth-mount {
            width: 100%;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <img src="https://raw.githubusercontent.com/secur1y/secur1y.github.io/refs/heads/main/assets/title.png" 
             alt="Secur1y Logo" 
             class="title-image">

        <div id="clerk-auth-mount"></div>
    </div>

    <script
      async
      crossorigin="anonymous"
      data-clerk-publishable-key="pk_live_Y2xlcmsuc2VjdXIxeS5jb20k"
      src="https://clerk.secur1y.com/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
      type="text/javascript">
    </script>

    <script>
        window.addEventListener('load', async function () {
            await Clerk.load();

            if (Clerk.user) {
                // Redirect to /app if already logged in
                window.location.href = "/app";
            } else {
                // Mount Sign-In component
                Clerk.mountSignIn(document.getElementById('clerk-auth-mount'), {
                    appearance: {
                        // This makes the Clerk box match a dark/Discord theme better
                        variables: { colorPrimary: '#5865F2' }, 
                    },
                    afterSignInUrl: '/app',
                    afterSignUpUrl: '/app',
                });
            }
        });
    </script>
</body>
</html>
