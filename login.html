<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DServer - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: "gg sans", Helvetica, Arial, sans-serif;
      background: #36393f;
      height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
    }
    #app { width: 100%; max-width: 420px; }
  </style>
</head>
<body>
  <div id="app">Loading...</div>

<script
  async
  crossorigin="anonymous"
  data-clerk-publishable-key="pk_live_Y2xlcmsuc2VjdXIxeS5jb20k"
  src="https://clerk.secur1y.com/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
  type="text/javascript">
</script>

<script>

import { useUser } from '@clerk/nextjs';

function UserProfile() {
  const { isLoaded, isSignedIn, user } = useUser();

  if (!isLoaded) {
    return <div>Loading...</div>;
  }

  if (isSignedIn) {
    window.location.replace('/app')
  } else {
    document.getElementById('app').innerHTML = '<div id="sign-in"></div>'
    Clerk.mountSignIn('#sign-in')
  }
}
  
window.addEventListener('load', async () => {
  await Clerk.load({})
  if (Clerk.user) {
    window.location.replace('/app')
  } else {
    document.getElementById('app').innerHTML = '<div id="sign-in"></div>'
    Clerk.mountSignIn('#sign-in')
  }
})
</script>
</body>
</html>
