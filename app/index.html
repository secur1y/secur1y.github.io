<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DServer - App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "gg sans", Helvetica, Arial, sans-serif;
      background: #36393f
        url('https://images.alphacoders.com/131/1318929.png')
        center / cover no-repeat;
      color: #dcddde;
      height: 100vh;
      display: flex;
    }
    /* Sidebar */
    .sidebar {
      width: 72px;
      background: #202225;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
    }
    .sidebar-top {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    /* DMs icon */
    .dm-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #313338;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, border-radius 0.15s;
    }
    .dm-icon:hover {
      background: #5865f2;
      border-radius: 16px;
    }
    .dm-icon img {
      width: 28px;
      height: 28px;
    }
    /* User panel at bottom */
    .user-panel {
      width: 100%;
      background: #232428;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #5865f2;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-radius 0.2s;
      position: relative;
    }
    .user-avatar:hover {
      border-radius: 16px;
    }
    .status-indicator {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 12px;
      height: 12px;
      background: #23a559;
      border: 3px solid #232428;
      border-radius: 50%;
    }
    .user-avatar img {
      width: 100%;
      height: 100%;
      border-radius: inherit;
    }
    .panel-icon {
      width: 20px;
      height: 20px;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s;
      color: #b5bac1;
    }
    .panel-icon:hover {
      opacity: 1;
    }
    /* Main content */
    #app {
      flex: 1;
      display: grid;
      place-items: center;
      min-width: 380px;
    }
  </style>
</head>
<body>
  <!-- LEFT SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-top">
      <div class="dm-icon" title="Direct Messages">
        <img
          src="https://raw.githubusercontent.com/simpsonslover/data/refs/heads/main/dms.png"
          alt="DMs"
        />
      </div>
    </div>
    <div class="user-panel">
      <div class="user-avatar" id="userAvatar" title="User Settings">
        <div class="status-indicator"></div>
      </div>
      <svg class="panel-icon" title="User Settings" viewBox="0 0 24 24" fill="currentColor">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M19.738 10H22V14H19.739C19.498 14.931 19.1 15.798 18.565 16.564L20 18L18 20L16.565 18.564C15.797 19.099 14.932 19.498 14 19.738V22H10V19.738C9.069 19.498 8.203 19.099 7.436 18.564L6 20L4 18L5.436 16.564C4.901 15.799 4.502 14.932 4.262 14H2V10H4.262C4.502 9.068 4.9 8.202 5.436 7.436L4 6L6 4L7.436 5.436C8.202 4.9 9.068 4.502 10 4.262V2H14V4.261C14.932 4.502 15.797 4.9 16.565 5.435L18 3.999L20 5.999L18.564 7.436C19.099 8.202 19.498 9.069 19.738 10ZM12 16C14.2091 16 16 14.2091 16 12C16 9.79086 14.2091 8 12 8C9.79086 8 8 9.79086 8 12C8 14.2091 9.79086 16 12 16Z"/>
      </svg>
    </div>
  </div>
  <!-- APP -->
  <div id="app">Loading...</div>
  
  <!-- Clerk Authentication -->
  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_live_Y2xlcmsuc2VjdXIxeS5jb20k"

      projectId: "ds-dms-662ce",

  <!-- Clerk Initialization -->
  <script>
    async function initApp() {
      try {
        // Wait for Clerk to be available
        while (typeof Clerk === 'undefined') {
          await new Promise(resolve => setTimeout(resolve, 100));
        }
        
        await Clerk.load();
        
        const app = document.getElementById('app');
        
        // Check if user is signed in
        if (Clerk.user) {
          // User is authenticated, show the app
          app.innerHTML = '<div id="user-button"></div>';
          Clerk.mountUserButton('#user-button');
          
          // Set user avatar
          const userAvatar = document.getElementById('userAvatar');
          if (Clerk.user.imageUrl) {
            userAvatar.innerHTML = `<img src="${Clerk.user.imageUrl}" alt="User"><div class="status-indicator"></div>`;
          } else {
            userAvatar.innerHTML = `<span style="color: white; font-weight: bold;">${Clerk.user.firstName?.[0] || 'U'}</span><div class="status-indicator"></div>`;
          }
          
          console.log("User authenticated:", Clerk.user.id);
          console.log("Firebase databases ready to use!");
        } else {
          // User is NOT authenticated, redirect to login
          window.location.href = '/login';
        }
      } catch (error) {
        console.error('Clerk initialization error:', error);
        // On error, also redirect to login
        window.location.href = '/login';
      }
    }
    
    // Start initialization when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
