<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DServer - App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "gg sans", Helvetica, Arial, sans-serif;
      background: #36393f url('https://images.alphacoders.com/131/1318929.png') center / cover no-repeat;
      color: #dcddde;
      height: 100vh;
      display: flex;
    }

    #loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }

    #loading-spinner {
      width: 96px;
      height: 96px;
      animation: spin 1.2s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .sidebar {
      width: 72px;
      background: #202225;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
    }

    .sidebar-top {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .dm-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #313338;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, border-radius 0.15s;
    }

    .dm-icon:hover {
      background: #5865f2;
      border-radius: 16px;
    }

    .dm-icon img {
      width: 28px;
      height: 28px;
    }

    .user-panel {
      width: 100%;
      background: #232428;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #5865f2;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-radius 0.2s;
      position: relative;
    }

    .user-avatar:hover {
      border-radius: 16px;
    }

    .status-indicator {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 12px;
      height: 12px;
      background: #23a559;
      border: 3px solid #232428;
      border-radius: 50%;
    }

    .panel-icon {
      width: 20px;
      height: 20px;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s;
      color: #b5bac1;
    }

    .panel-icon:hover {
      opacity: 1;
    }

    #app {
      flex: 1;
      display: grid;
      place-items: center;
      min-width: 380px;
    }
  </style>
</head>

<body>

  <div id="loading-overlay">
    <img id="loading-spinner" src="https://raw.githubusercontent.com/secur1y/secur1y.github.io/refs/heads/main/assets/box.png" alt="Loading">
  </div>

  <div class="sidebar">
    <div class="sidebar-top">
      <div class="dm-icon">
        <img src="https://raw.githubusercontent.com/simpsonslover/data/refs/heads/main/dms.png">
      </div>
    </div>

    <div class="user-panel">
      <div class="user-avatar" id="userAvatar">
        <div class="status-indicator"></div>

      <svg class="panel-icon" viewBox="0 0 24 24" fill="currentColor">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M19.738 10H22V14H19.739C19.498 14.931 19.1 15.798 18.565 16.564L20 18L18 20L16.565 18.564C15.797 19.099 14.932 19.498 14 19.738V22H10V19.738C9.069 19.498 8.203 19.099 7.436 18.564L6 20L4 18L5.436 16.564C4.901 15.799 4.502 14.932 4.262 14H2V10H4.262C4.502 9.068 4.9 8.202 5.436 7.436L4 6L6 4L7.436 5.436C8.202 4.9 9.068 4.502 10 4.262V2H14V4.261C14.932 4.502 15.797 4.9 16.565 5.435L18 3.999L20 5.999L18.564 7.436C19.099 8.202 19.498 9.069 19.738 10ZM12 16C14.2091 16 16 14.2091 16 12C16 9.79086 14.2091 8 12 8C9.79086 8 8 9.79086 8 12C8 14.2091 9.79086 16 12 16Z"/>
      </svg>
    </div>
  </div>

  <div id="app">Loading...</div>

  <script async crossorigin="anonymous" data-clerk-publishable-key="pk_live_Y2xlcmsuc2VjdXIxeS5jb20k" src="https://becoming-boxer-84.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-analytics.js";

    if (location.protocol !== 'https:') {
      location.replace(`https:${location.href.substring(location.protocol.length)}`);
    }

      projectId: "ds-dms-662ce"
    }, "dms");

    const serversApp = initializeApp({

  <script>
    async function initApp() {
      while (typeof Clerk === 'undefined') {
        await new Promise(r => setTimeout(r, 100));
      }

      await Clerk.load();

      const app = document.getElementById('app');
      const overlay = document.getElementById('loading-overlay');

      if (!Clerk.user) {
        location.href = '/login';
        return;
      }

      app.innerHTML = '<div id="user-button"></div>';
      Clerk.mountUserButton('#user-button');

      const avatar = document.getElementById('userAvatar');
      avatar.innerHTML = Clerk.user.imageUrl
        ? `<img src="${Clerk.user.imageUrl}"><div class="status-indicator"></div>`
        : `<span>${Clerk.user.firstName?.[0] || 'U'}</span><div class="status-indicator"></div>`;

      overlay.style.opacity = '0';
      overlay.style.pointerEvents = 'none';
      setTimeout(() => overlay.remove(), 300);
    }

    document.readyState === 'loading'
      ? document.addEventListener('DOMContentLoaded', initApp)
      : initApp();
  </script>

</body>
</html>
