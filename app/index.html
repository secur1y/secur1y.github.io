<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DServer - App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "gg sans", Helvetica, Arial, sans-serif;
      background: #36393f
        url('https://images.alphacoders.com/131/1318929.png')
        center / cover no-repeat;
      color: #dcddde;
      height: 100vh;
      display: flex;
    }
    /* Sidebar */
    .sidebar {
      width: 72px;
      background: #202225;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 12px;
    }
    /* DMs icon */
    .dm-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #313338;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, border-radius 0.15s;
    }
    .dm-icon:hover {
      background: #5865f2;
      border-radius: 16px;
    }
    .dm-icon img {
      width: 28px;
      height: 28px;
    }
    /* Main content */
    #app {
      flex: 1;
      display: grid;
      place-items: center;
      min-width: 380px;
    }
  </style>
</head>
<body>
  <!-- LEFT SIDEBAR -->
  <div class="sidebar">
    <div class="dm-icon" title="Direct Messages">
      <img
        src="https://raw.githubusercontent.com/simpsonslover/data/refs/heads/main/dms.png"
        alt="DMs"
      />
    </div>
  </div>
  <!-- APP -->
  <div id="app">Loading...</div>
  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_YmVjb21pbmctYm94ZXItODQuY2xlcmsuYWNjb3VudHMuZGV2JA"
    src="https://becoming-boxer-84.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
    type="text/javascript"
  ></script>
  <script>
    async function initApp() {
      try {
        // Wait for Clerk to be available
        while (typeof Clerk === 'undefined') {
          await new Promise(resolve => setTimeout(resolve, 100));
        }
        
        await Clerk.load();
        
        const app = document.getElementById('app');
        
        // Check if user is signed in
        if (Clerk.user) {
          // User is authenticated, show the app
          app.innerHTML = '<div id="user-button"></div>';
          Clerk.mountUserButton('#user-button');
        } else {
          // User is NOT authenticated, redirect to login
          window.location.href = '/login';
        }
      } catch (error) {
        console.error('Clerk initialization error:', error);
        // On error, also redirect to login
        window.location.href = '/login';
      }
    }
    
    // Start initialization when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
