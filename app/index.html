<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DServer - App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "gg sans", Helvetica, Arial, sans-serif;
      background: #36393f;
      color: #dcddde;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    #loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }

    #loading-spinner {
      width: 150px;
      height: 150px;
      animation: spin 1.2s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .sidebar {
      width: 72px;
      background: #202225;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
    }

    .sidebar-top {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .dm-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #5865f2;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, border-radius 0.15s;
    }

    .dm-icon:hover {
      background: #4752c4;
      border-radius: 16px;
    }

    .dm-icon img {
      width: 28px;
      height: 28px;
    }

    .user-panel {
      width: 100%;
      background: #232428;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #5865f2;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-radius 0.2s;
      position: relative;
      overflow: hidden;
    }

    .user-avatar img {
      width: 32px;
      height: 32px;
      object-fit: cover;
      border-radius: 50%;
    }

    .user-avatar span {
      color: white;
      font-weight: bold;
      font-size: 14px;
    }

    .user-avatar:hover {
      border-radius: 16px;
    }

    .status-indicator {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 12px;
      height: 12px;
      background: #23a559;
      border: 3px solid #232428;
      border-radius: 50%;
    }

    .panel-icon {
      width: 20px;
      height: 20px;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s;
      color: #b5bac1;
    }

    .panel-icon:hover {
      opacity: 1;
    }

    /* DM List Panel */
    .dm-list {
      width: 240px;
      background: #2b2d31;
      display: flex;
      flex-direction: column;
    }

    .dm-list-header {
      padding: 12px 16px;
      border-bottom: 1px solid #1e1f22;
      font-weight: 600;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .add-friend-btn {
      width: 20px;
      height: 20px;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s;
      color: #b5bac1;
    }

    .add-friend-btn:hover {
      opacity: 1;
    }

    .dm-conversations {
      flex: 1;
      overflow-y: auto;
    }

    .dm-item {
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .dm-item:hover {
      background: #35373c;
    }

    .dm-item.active {
      background: #404249;
    }

    .dm-item-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #5865f2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 14px;
      flex-shrink: 0;
    }

    .dm-item-info {
      flex: 1;
      overflow: hidden;
    }

    .dm-item-name {
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Chat Area */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #313338;
    }

    .chat-header {
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #26272b;
      font-weight: 600;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 12px;
    }

    .message-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #5865f2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      flex-shrink: 0;
    }

    .message-content {
      flex: 1;
    }

    .message-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }

    .message-author {
      font-weight: 600;
      font-size: 15px;
    }

    .message-timestamp {
      font-size: 12px;
      color: #949ba4;
    }

    .message-text {
      font-size: 15px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .chat-input-container {
      padding: 16px;
    }

    .chat-input {
      background: #383a40;
      border: none;
      border-radius: 8px;
      padding: 12px;
      color: #dcddde;
      font-size: 15px;
      font-family: inherit;
      width: 100%;
      resize: none;
    }

    .chat-input:focus {
      outline: none;
    }

    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      color: #949ba4;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: #313338;
      border-radius: 8px;
      width: 440px;
      max-width: 90vw;
    }

    .modal-header {
      padding: 16px;
      font-weight: 600;
      font-size: 20px;
      text-align: center;
    }

    .modal-body {
      padding: 0 16px 16px;
    }

    .modal-input {
      width: 100%;
      background: #1e1f22;
      border: 1px solid #1e1f22;
      border-radius: 4px;
      padding: 10px;
      color: #dcddde;
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 16px;
    }

    .modal-input:focus {
      outline: none;
      border-color: #5865f2;
    }

    .modal-footer {
      padding: 16px;
      background: #2b2d31;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      border-radius: 0 0 8px 8px;
    }

    .modal-btn {
      padding: 10px 16px;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .modal-btn-cancel {
      background: transparent;
      color: #dcddde;
    }

    .modal-btn-cancel:hover {
      background: #4e5058;
    }

    .modal-btn-primary {
      background: #5865f2;
      color: white;
    }

    .modal-btn-primary:hover {
      background: #4752c4;
    }

    .modal-btn-primary:disabled {
      background: #4752c4;
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <div id="loading-overlay">
    <img id="loading-spinner" src="https://raw.githubusercontent.com/secur1y/secur1y.github.io/refs/heads/main/assets/box.png" alt="Loading">
  </div>

  <div class="sidebar">
    <div class="sidebar-top">
      <div class="dm-icon">
        <img src="https://raw.githubusercontent.com/simpsonslover/data/refs/heads/main/dms.png">
      </div>
    </div>

    <div class="user-panel">
      <div class="user-avatar" id="userAvatar">
        <div class="status-indicator"></div>
      </div>

      <svg class="panel-icon" viewBox="0 0 24 24" fill="currentColor">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M19.738 10H22V14H19.739C19.498 14.931 19.1 15.798 18.565 16.564L20 18L18 20L16.565 18.564C15.797 19.099 14.932 19.498 14 19.738V22H10V19.738C9.069 19.498 8.203 19.099 7.436 18.564L6 20L4 18L5.436 16.564C4.901 15.799 4.502 14.932 4.262 14H2V10H4.262C4.502 9.068 4.9 8.202 5.436 7.436L4 6L6 4L7.436 5.436C8.202 4.9 9.068 4.502 10 4.262V2H14V4.261C14.932 4.502 15.797 4.9 16.565 5.435L18 3.999L20 5.999L18.564 7.436C19.099 8.202 19.498 9.069 19.738 10ZM12 16C14.2091 16 16 14.2091 16 12C16 9.79086 14.2091 8 12 8C9.79086 8 8 9.79086 8 12C8 14.2091 9.79086 16 12 16Z"/>
      </svg>
    </div>
  </div>

  <div class="dm-list">
    <div class="dm-list-header">
      <span>Direct Messages</span>
      <svg class="add-friend-btn" id="addFriendBtn" viewBox="0 0 24 24" fill="currentColor" title="Add Friend">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>
      </svg>
    </div>
    <div class="dm-conversations" id="dmConversations">
      <div class="empty-state">
        <div>No conversations yet</div>
      </div>
    </div>
  </div>

  <div class="chat-area">
    <div class="chat-header" id="chatHeader">Select a conversation</div>
    <div class="chat-messages" id="chatMessages">
      <div class="empty-state">
        <div>Select a DM to start chatting</div>
      </div>
    </div>
    <div class="chat-input-container" id="chatInputContainer" style="display: none;">
      <textarea class="chat-input" id="chatInput" placeholder="Type a message..." rows="1"></textarea>
    </div>
  </div>

    <!-- Add Friend Modal -->
  <div class="modal-overlay" id="addFriendModal">
    <div class="modal">
      <div class="modal-header">Add Friend</div>
      <div class="modal-body">
        <input 
          type="text" 
          class="modal-input" 
          id="friendUsernameInput" 
          placeholder="Enter friend's username or user ID"
        />
      </div>
      <div class="modal-footer">
        <button class="modal-btn modal-btn-cancel" id="cancelBtn">Cancel</button>
        <button class="modal-btn modal-btn-primary" id="sendRequestBtn">Send Request</button>
      </div>
    </div>
  </div>

  <script async crossorigin="anonymous" data-clerk-publishable-key="pk_live_Y2xlcmsuc2VjdXIxeS5jb20k" src="https://clerk.secur1y.com/npm/@clerk/clerk-js@5/dist/clerk.browser.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

    const dmsApp = initializeApp({
      apiKey: "AIzaSyAMLiU4bxYMI06gYXmx5FSUaKnN3ImVERs",
      authDomain: "ds-dms-662ce.firebaseapp.com",
      projectId: "ds-dms-662ce"
    }, "dms");

    window.dmsDB = getFirestore(dmsApp);
    window.firebaseDB = { collection, doc, setDoc, getDoc, getDocs, addDoc, onSnapshot, query, orderBy };
    window.currentUserId = null;
    window.currentChatId = null;

    async function initApp() {
      while (typeof Clerk === 'undefined') {
        await new Promise(r => setTimeout(r, 100));
      }

      await Clerk.load();

      const overlay = document.getElementById('loading-overlay');

      if (!Clerk.user) {
        location.href = '/login.html';
        return;
      }

      window.currentUserId = Clerk.user.id;

      const avatar = document.getElementById('userAvatar');
      avatar.innerHTML = Clerk.user.imageUrl
        ? `<img src="${Clerk.user.imageUrl}"><div class="status-indicator"></div>`
        : `<span style="color: white; font-weight: bold;">${Clerk.user.firstName?.[0] || 'U'}</span><div class="status-indicator"></div>`;

      // Hide loading overlay
      overlay.style.opacity = '0';
      overlay.style.pointerEvents = 'none';
      setTimeout(() => overlay.remove(), 300);

      loadDMConversations();
      setupChatInput();
      setupAddFriendButton();
    }

    function setupAddFriendButton() {
      document.getElementById('addFriendBtn').addEventListener('click', () => {
        document.getElementById('addFriendModal').classList.add('active');
        document.getElementById('friendUsernameInput').value = '';
      });

      document.getElementById('cancelBtn').addEventListener('click', closeAddFriendModal);
      document.getElementById('sendRequestBtn').addEventListener('click', sendFriendRequest);

      // Close modal when clicking outside
      document.getElementById('addFriendModal').addEventListener('click', (e) => {
        if (e.target.id === 'addFriendModal') {
          closeAddFriendModal();
        }
      });
    }

    function closeAddFriendModal() {
      document.getElementById('addFriendModal').classList.remove('active');
    }

    async function sendFriendRequest() {
      const input = document.getElementById('friendUsernameInput');
      const friendUsername = input.value.trim();
      
      if (!friendUsername) {
        alert('Please enter a username');
        return;
      }

      const sendBtn = document.getElementById('sendRequestBtn');
      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending...';

      try {
        const { doc, setDoc, getDoc, addDoc, collection, getDocs, query, where } = window.firebaseDB;
        
        // First, look up the friend's user ID by username
        const usersRef = collection(window.dmsDB, 'users');
        const q = query(usersRef, where('username', '==', friendUsername));
        const querySnapshot = await getDocs(q);
        
        if (querySnapshot.empty) {
          alert('User not found. Make sure they have logged in at least once.');
          sendBtn.disabled = false;
          sendBtn.textContent = 'Send Request';
          return;
        }

        const friendDoc = querySnapshot.docs[0];
        const friendId = friendDoc.id;
        const friendData = friendDoc.data();
        
        // Create a unique chat ID (sort user IDs to ensure consistency)
        const chatId = [window.currentUserId, friendId].sort().join('_');
        
        // Check if conversation already exists for current user
        const myConvoRef = doc(window.dmsDB, `users/${window.currentUserId}/conversations/${chatId}`);
        const myConvo = await getDoc(myConvoRef);
        
        if (myConvo.exists()) {
          alert('Conversation already exists!');
          closeAddFriendModal();
          sendBtn.disabled = false;
          sendBtn.textContent = 'Send Request';
          return;
        }

        // Get current user's name
        const currentUserName = Clerk.user.username || Clerk.user.firstName || window.currentUserId;

        // Create conversation for BOTH users with proper data
        const conversationData = {
          chatId: chatId,
          createdAt: Date.now(),
          lastMessage: 'Conversation started!',
          lastMessageTime: Date.now()
        };

        // Create for current user
        await setDoc(doc(window.dmsDB, `users/${window.currentUserId}/conversations/${chatId}`), {
          ...conversationData,
          name: friendUsername,
          otherUserId: friendId
        });

        // Create for friend
        await setDoc(doc(window.dmsDB, `users/${friendId}/conversations/${chatId}`), {
          ...conversationData,
          name: currentUserName,
          otherUserId: window.currentUserId
        });

        // Create the chat document
        await setDoc(doc(window.dmsDB, `chats/${chatId}`), {
          participants: [window.currentUserId, friendId],
          createdAt: Date.now(),
          createdBy: window.currentUserId
        });

        // Send initial message
        const messagesRef = collection(window.dmsDB, `chats/${chatId}/messages`);
        await addDoc(messagesRef, {
          author: 'System',
          text: 'Conversation started!',
          timestamp: Date.now(),
          userId: 'system'
        });

        closeAddFriendModal();
        alert('Friend added! Conversation created.');
        
        // Refresh the conversation list
        loadDMConversations();
      } catch (error) {
        console.error('Error sending friend request:', error);
        alert('Failed to add friend: ' + error.message);
      }

      sendBtn.disabled = false;
      sendBtn.textContent = 'Send Request';
    }

    window.closeAddFriendModal = closeAddFriendModal;
    window.sendFriendRequest = sendFriendRequest;

    function loadDMConversations() {
      const { collection, onSnapshot } = window.firebaseDB;
      const conversationsRef = collection(window.dmsDB, `users/${window.currentUserId}/conversations`);
      
      onSnapshot(conversationsRef, (snapshot) => {
        const container = document.getElementById('dmConversations');
        
        if (snapshot.empty) {
          container.innerHTML = '<div class="empty-state"><div>No conversations yet</div></div>';
          return;
        }

        container.innerHTML = '';
        snapshot.forEach((docSnap) => {
          const convo = docSnap.data();
          const item = document.createElement('div');
          item.className = 'dm-item';
          item.innerHTML = `
            <div class="dm-item-avatar">${convo.name[0]}</div>
            <div class="dm-item-info">
              <div class="dm-item-name">${convo.name}</div>
            </div>
          `;
          item.onclick = () => openChat(docSnap.id, convo.name);
          container.appendChild(item);
        });
      });
    }

    function openChat(chatId, chatName) {
      window.currentChatId = chatId;
      document.getElementById('chatHeader').textContent = chatName;
      document.getElementById('chatInputContainer').style.display = 'block';
      
      document.querySelectorAll('.dm-item').forEach(el => el.classList.remove('active'));
      const clickedItem = Array.from(document.querySelectorAll('.dm-item')).find(el => {
        return el.textContent.includes(chatName);
      });
      if (clickedItem) clickedItem.classList.add('active');

      const { collection, query, orderBy, onSnapshot } = window.firebaseDB;
      const messagesRef = collection(window.dmsDB, `chats/${chatId}/messages`);
      const messagesQuery = query(messagesRef, orderBy('timestamp', 'asc'));
      
      onSnapshot(messagesQuery, (snapshot) => {
        const container = document.getElementById('chatMessages');
        
        if (snapshot.empty) {
          container.innerHTML = '<div class="empty-state"><div>No messages yet. Start the conversation!</div></div>';
          return;
        }

        container.innerHTML = '';
        snapshot.forEach((docSnap) => {
          const msg = docSnap.data();
          const messageEl = document.createElement('div');
          messageEl.className = 'message';
          messageEl.innerHTML = `
            <div class="message-avatar">${msg.author[0]}</div>
            <div class="message-content">
              <div class="message-header">
                <span class="message-author">${msg.author}</span>
                <span class="message-timestamp">${new Date(msg.timestamp).toLocaleTimeString()}</span>
              </div>
              <div class="message-text">${msg.text}</div>
            </div>
          `;
          container.appendChild(messageEl);
        });
        
        container.scrollTop = container.scrollHeight;
      });
    }

    function setupChatInput() {
      const input = document.getElementById('chatInput');
      
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
    }

    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      
      if (!text || !window.currentChatId) return;

      const { collection, addDoc } = window.firebaseDB;
      const messagesRef = collection(window.dmsDB, `chats/${window.currentChatId}/messages`);
      
      await addDoc(messagesRef, {
        author: Clerk.user.firstName || 'User',
        text: text,
        timestamp: Date.now(),
        userId: window.currentUserId
      });

      input.value = '';
    }

    window.sendMessage = sendMessage;

    document.readyState === 'loading'
      ? document.addEventListener('DOMContentLoaded', initApp)
      : initApp();
  </script>

</body>
</html>
