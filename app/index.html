<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DServer - App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="loading-overlay">
    <img id="loading-spinner" src="https://raw.githubusercontent.com/secur1y/secur1y.github.io/refs/heads/main/assets/box.png" alt="Loading">
  </div>

  <div class="sidebar">
    <div class="sidebar-top">
      <div class="dm-icon">
        <img src="https://raw.githubusercontent.com/simpsonslover/data/refs/heads/main/dms.png">
      </div>
    </div>

    <div class="user-panel">
      <div class="user-avatar" id="userAvatar">
        <div class="status-indicator"></div>
      </div>

      <svg class="panel-icon" viewBox="0 0 24 24" fill="currentColor">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M19.738 10H22V14H19.739C19.498 14.931 19.1 15.798 18.565 16.564L20 18L18 20L16.565 18.564C15.797 19.099 14.932 19.498 14 19.738V22H10V19.738C9.069 19.498 8.203 19.099 7.436 18.564L6 20L4 18L5.436 16.564C4.901 15.799 4.502 14.932 4.262 14H2V10H4.262C4.502 9.068 4.9 8.202 5.436 7.436L4 6L6 4L7.436 5.436C8.202 4.9 9.068 4.502 10 4.262V2H14V4.261C14.932 4.502 15.797 4.9 16.565 5.435L18 3.999L20 5.999L18.564 7.436C19.099 8.202 19.498 9.069 19.738 10ZM12 16C14.2091 16 16 14.2091 16 12C16 9.79086 14.2091 8 12 8C9.79086 8 8 9.79086 8 12C8 14.2091 9.79086 16 12 16Z"/>
      </svg>
    </div>
  </div>

  <div class="sidebar">
    <div class="sidebar-top">
      <div class="dm-icon">
        <img src="https://raw.githubusercontent.com/simpsonslover/data/refs/heads/main/dms.png">
      </div>
    </div>
  </div>

  <div class="dm-list">
    <div class="dm-list-header">
      <span>Direct Messages</span>
      <svg class="add-friend-btn" id="addFriendBtn" viewBox="0 0 24 24" fill="currentColor" title="Add Friend">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>
      </svg>
    </div>
    <div class="dm-conversations" id="dmConversations">
      <div class="empty-state">
        <div>No conversations yet</div>
      </div>
    </div>
  </div>

  <div class="chat-area">
    <div id="friendRequestActions" style="display: none;"></div>
    <div class="chat-header" id="chatHeader">Select a conversation</div>
    <div class="chat-messages" id="chatMessages">
      <div class="empty-state">
        <div>Select a DM to start chatting</div>
      </div>
    </div>
    <div class="chat-input-container" id="chatInputContainer" style="display: none;">
      <textarea class="chat-input" id="chatInput" placeholder="Type a message..." rows="1"></textarea>
    </div>
  </div>

  <!-- Add Friend Modal -->
  <div class="modal-overlay" id="addFriendModal">
    <div class="modal">
      <div class="modal-header">Add Friend</div>
      <div class="modal-body">
        <input 
          type="text" 
          class="modal-input" 
          id="friendUsernameInput" 
          placeholder="Enter friend's username"
        />
      </div>
      <div class="modal-footer">
        <button class="modal-btn modal-btn-cancel" id="cancelBtn">Cancel</button>
        <button class="modal-btn modal-btn-primary" id="sendRequestBtn">Send Request</button>
      </div>
    </div>
  </div>

  <script async crossorigin="anonymous" data-clerk-publishable-key="pk_live_Y2xlcmsuc2VjdXIxeS5jb20k" src="https://clerk.secur1y.com/npm/@clerk/clerk-js@5/dist/clerk.browser.js"></script>
  <script type="module" src="main.js"></script>

</body>
</html>
